<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="LiveActivityKit: Live Activities and Dynamic Island templates for SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a1a"/>
      <stop offset="1" stop-color="#1d1238"/>
    </linearGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29206b"/>
      <stop offset="0.55" stop-color="#8c3885"/>
      <stop offset="1" stop-color="#ed7366"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- Title -->
  <text x="80" y="196" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">LiveActivityKit</text>
  <text x="82" y="248" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#b9b0dc">Live Activity and Dynamic Island templates</text>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">
    <rect x="82" y="288" width="122" height="40" rx="20" fill="#ff6b00" fill-opacity="0.18"/>
    <text x="143" y="315" text-anchor="middle" fill="#ff9a52">Delivery</text>
    <rect x="216" y="288" width="96" height="40" rx="20" fill="#ffcc00" fill-opacity="0.16"/>
    <text x="264" y="315" text-anchor="middle" fill="#ffd84d">Timer</text>
    <rect x="324" y="288" width="96" height="40" rx="20" fill="#0a84ff" fill-opacity="0.2"/>
    <text x="372" y="315" text-anchor="middle" fill="#64b0ff">Score</text>
    <rect x="432" y="288" width="86" height="40" rx="20" fill="#30d158" fill-opacity="0.18"/>
    <text x="475" y="315" text-anchor="middle" fill="#6ee28f">Ride</text>
  </g>
  <text x="82" y="376" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b82b0">Lock Screen · compact · minimal · expanded</text>
  <text x="82" y="410" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b82b0">ActivityKit controller · stale dates · push tokens</text>

  <!-- iPhone -->
  <g filter="url(#shadow)">
    <rect x="760" y="40" width="420" height="560" rx="64" fill="#1b1a22"/>
    <rect x="772" y="52" width="396" height="560" rx="54" fill="url(#wallpaper)"/>
  </g>

  <!-- Dynamic Island, compact: delivery -->
  <rect x="868" y="66" width="204" height="36" rx="18" fill="#000000"/>
  <g fill="#ff8a2a">
    <rect x="884" y="76" width="18" height="14" rx="3"/>
    <rect x="900" y="80" width="8" height="10" rx="2"/>
    <circle cx="889" cy="92" r="3.5"/>
    <circle cx="903" cy="92" r="3.5"/>
  </g>
  <text x="1056" y="90" text-anchor="end" font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#ff8a2a">12 min</text>

  <!-- Clock -->
  <g font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" fill-opacity="0.92" text-anchor="middle">
    <text x="970" y="146" font-size="16" font-weight="600">Thursday, October 8</text>
    <text x="970" y="214" font-size="70" font-weight="700">9:41</text>
  </g>

  <!-- Lock Screen banner: delivery -->
  <rect x="790" y="250" width="360" height="152" rx="24" fill="#000000" fill-opacity="0.62"/>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="810" y="282" font-size="17" font-weight="600">On the way</text>
    <text x="810" y="304" font-size="13" font-weight="500" fill-opacity="0.65">Napoli Pizza · Order #4821</text>
    <text x="1130" y="296" text-anchor="end" font-size="30" font-weight="700" fill="#ff8a2a">12 min</text>
  </g>
  <g>
    <rect x="810" y="326" width="74" height="6" rx="3" fill="#ff8a2a"/>
    <rect x="890" y="326" width="74" height="6" rx="3" fill="#ff8a2a"/>
    <rect x="970" y="326" width="74" height="6" rx="3" fill="#ff8a2a" fill-opacity="0.55"/>
    <rect x="1050" y="326" width="80" height="6" rx="3" fill="#ffffff" fill-opacity="0.25"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#ffffff" fill-opacity="0.65">
    <text x="810" y="352">Ordered</text>
    <text x="890" y="352">Preparing</text>
    <text x="970" y="352">On the way</text>
    <text x="1050" y="352">Delivered</text>
  </g>
  <circle cx="822" cy="378" r="10" fill="#ffffff" fill-opacity="0.8"/>
  <text x="840" y="383" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Mia is on the way</text>

  <!-- Expanded island: score -->
  <rect x="790" y="420" width="360" height="132" rx="40" fill="#000000"/>
  <g font-family="-apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="820" y="458" font-size="15" font-weight="600" fill-opacity="0.7">HAW</text>
    <text x="820" y="494" font-size="34" font-weight="700" fill="#64b0ff">98</text>
    <text x="1120" y="458" text-anchor="end" font-size="15" font-weight="600" fill-opacity="0.7">FOX</text>
    <text x="1120" y="494" text-anchor="end" font-size="34" font-weight="700">95</text>
    <text x="970" y="488" text-anchor="middle" font-size="15" font-weight="600">Q4 · 4:12</text>
    <text x="970" y="530" text-anchor="middle" font-size="13" font-weight="500" fill-opacity="0.65">#23 Rivers · 3-pt jumper</text>
  </g>
  <rect x="924" y="430" width="92" height="26" rx="13" fill="#141414"/>
</svg>
